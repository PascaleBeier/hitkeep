name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GHT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
      meta_config: |
        type=raw,value=latest
        type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
        type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }}
      upload_to_release: true
      release_tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      token: ${{ secrets.GHT }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  link-release-blog:
    name: Link release blog
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Add release blog link to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GHT }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PATCH="${VERSION##*.}"
            if [[ "$PATCH" != "0" ]]; then
              echo "Skipping release blog link for patch release $VERSION"
              exit 0
            fi
          fi

          BLOG_SLUG="hitkeep-${VERSION//./-}"
          BLOG_URL="https://hitkeep.com/blog/${BLOG_SLUG}/"

          if ! curl -fsSLI "$BLOG_URL" >/dev/null; then
            echo "Release blog is not published yet; leaving GitHub Release notes unchanged: $BLOG_URL"
            exit 0
          fi

          release_found=false
          for attempt in {1..5}; do
            if gh release view "$TAG" --json body --jq .body > release-notes.md; then
              release_found=true
              break
            fi
            sleep 2
          done

          if [[ "$release_found" != "true" ]]; then
            echo "GitHub Release $TAG was not found"
            exit 1
          fi

          if grep -Fq "$BLOG_URL" release-notes.md; then
            echo "Release blog link already present"
            exit 0
          fi

          {
            printf '**Release blog:** [HitKeep %s](%s)\n\n' "$VERSION" "$BLOG_URL"
            cat release-notes.md
          } > updated-release-notes.md

          gh release edit "$TAG" --notes-file updated-release-notes.md

  publish-helm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Login to GHCR
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHT }}
        run: echo "${GHCR_TOKEN}" | helm registry login ghcr.io -u "${GHCR_ACTOR}" --password-stdin

      - name: Package chart
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          helm package charts/hitkeep --version "$VERSION" --app-version "$VERSION"

      - name: Push chart
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          helm push "hitkeep-${VERSION}.tgz" "oci://ghcr.io/pascalebeier/charts"

  sync-docs-release:
    name: Publish release and configuration metadata to docs
    needs:
      - release-please
      - build-release
      - publish-helm
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.build-release.result == 'success' && needs.publish-helm.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Dispatch hitkeep-docs release synchronization
        env:
          DOWNSTREAM_REPOSITORY: PascaleBeier/hitkeep-docs
          GH_TOKEN: ${{ secrets.HITKEEP_DOCS_DISPATCH_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::HITKEEP_DOCS_DISPATCH_TOKEN must grant Actions write access to PascaleBeier/hitkeep-docs"
            exit 1
          fi

          gh workflow run sync-hitkeep-release.yml \
            --repo "$DOWNSTREAM_REPOSITORY" \
            --ref main \
            -f tag="${TAG}" \
            -f dry_run=false \
            -f source_run_id="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

          downstream_run_id=""
          for attempt in {1..30}; do
            downstream_run_id="$(
              gh run list \
                --repo "$DOWNSTREAM_REPOSITORY" \
                --workflow sync-hitkeep-release.yml \
                --event workflow_dispatch \
                --limit 50 \
                --json databaseId,displayTitle \
                | jq -r --arg source_run_id "${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
                  '.[] | select(.displayTitle | endswith("source " + $source_run_id)) | .databaseId' \
                | head -n 1
            )"
            if [[ -n "$downstream_run_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$downstream_run_id" ]]; then
            echo "::error::Timed out locating the hitkeep-docs workflow run for source run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            exit 1
          fi

          downstream_url="$(
            gh run view "$downstream_run_id" \
              --repo "$DOWNSTREAM_REPOSITORY" \
              --json url \
              --jq .url
          )"
          echo "Watching hitkeep-docs release synchronization: ${downstream_url}"

          if ! gh run watch "$downstream_run_id" \
            --repo "$DOWNSTREAM_REPOSITORY" \
            --interval 15 \
            --exit-status; then
            echo "::error::hitkeep-docs release synchronization failed: ${downstream_url}"
            gh run view "$downstream_run_id" \
              --repo "$DOWNSTREAM_REPOSITORY" \
              --log-failed || true
            exit 1
          fi

          echo "hitkeep-docs release synchronization completed successfully: ${downstream_url}"

  deploy-cloud:
    name: Trigger cloud deploy
    needs:
      - release-please
      - build-release
      - publish-helm
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.build-release.result == 'success' && needs.publish-helm.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch hitkeep-infra release deploy
        env:
          GH_TOKEN: ${{ secrets.GHT }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          artifact_url="https://github.com/PascaleBeier/hitkeep/releases/download/${TAG}/hitkeep-cloud-linux-arm64"

          gh workflow run release-deploy.yml \
            --repo PascaleBeier/hitkeep-infra \
            --ref main \
            -f stack=both \
            -f artifact_url="${artifact_url}" \
            -f release_version="${TAG}" \
            -f mode=deploy

          echo "Triggered hitkeep-infra release deploy for ${TAG}: ${artifact_url}"
