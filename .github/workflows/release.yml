name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GHT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
      checkout_ref: ${{ github.sha }}
      meta_config: |
        type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
      upload_to_release: true
      release_tag_name: ${{ needs.release-please.outputs.tag_name }}
      release_source_tag: ${{ needs.release-please.outputs.tag_name }}
      release_source_sha: ${{ github.sha }}
    secrets:
      token: ${{ secrets.GHT }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  upgrade-from-v2-12:
    name: Upgrade from v2.12.0
    needs:
      - release-please
      - build-release
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.build-release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Smoke upgrade from supported floor
        env:
          CANDIDATE_DIGEST: ${{ needs.build-release.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="tests/fixtures/release-fixtures.json"
          if [[ ! "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "invalid candidate image digest" >&2
            exit 1
          fi
          candidate="ghcr.io/${GITHUB_REPOSITORY}@${CANDIDATE_DIGEST}"
          docker pull "$candidate"
          platform="linux/$(docker image inspect "$candidate" --format '{{.Architecture}}')"
          previous="$(jq -r --arg platform "$platform" '.fixtures[] | select(.previous_version == "2.12.0" and .platform == $platform) | .previous_image' "$manifest")"
          if [[ -z "$previous" || "$previous" == "null" || "$previous" != *@sha256:* ]]; then
            echo "release fixture has no immutable v2.12.0 image for ${platform}" >&2
            exit 1
          fi
          HITKEEP_PREVIOUS_IMAGE="$previous" ./scripts/docker-smoke.sh "$candidate" self-hosted --recreate

  upgrade-compose-from-v2-12:
    name: Compose upgrade from v2.12.0
    needs:
      - release-please
      - build-release
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.build-release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Smoke Compose upgrade from supported floor
        env:
          CANDIDATE_DIGEST: ${{ needs.build-release.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="tests/fixtures/release-fixtures.json"
          if [[ ! "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "invalid candidate image digest" >&2
            exit 1
          fi
          candidate="ghcr.io/${GITHUB_REPOSITORY}@${CANDIDATE_DIGEST}"
          docker pull "$candidate"
          platform="linux/$(docker image inspect "$candidate" --format '{{.Architecture}}')"
          previous="$(jq -r --arg platform "$platform" '.fixtures[] | select(.previous_version == "2.12.0" and .platform == $platform) | .previous_image' "$manifest")"
          if [[ -z "$previous" || "$previous" == "null" || "$previous" != *@sha256:* ]]; then
            echo "release fixture has no immutable v2.12.0 image for ${platform}" >&2
            exit 1
          fi
          HITKEEP_PREVIOUS_IMAGE="$previous" ./scripts/compose-smoke.sh "$candidate" self-hosted

  upgrade-helm-from-v2-12:
    name: Helm upgrade from v2.12.0
    needs:
      - release-please
      - build-release
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.build-release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install kind
        shell: bash
        run: |
          set -euo pipefail
          go install sigs.k8s.io/kind@v0.29.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Smoke Helm upgrade from supported floor
        env:
          CANDIDATE_DIGEST: ${{ needs.build-release.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="tests/fixtures/release-fixtures.json"
          if [[ ! "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "invalid candidate image digest" >&2
            exit 1
          fi
          candidate="ghcr.io/${GITHUB_REPOSITORY}@${CANDIDATE_DIGEST}"
          docker pull "$candidate"
          platform="linux/$(docker image inspect "$candidate" --format '{{.Architecture}}')"
          previous="$(jq -r --arg platform "$platform" '.fixtures[] | select(.previous_version == "2.12.0" and .platform == $platform) | .previous_image' "$manifest")"
          if [[ -z "$previous" || "$previous" == "null" || "$previous" != *@sha256:* ]]; then
            echo "release fixture has no immutable v2.12.0 image for ${platform}" >&2
            exit 1
          fi
          cluster="hitkeep-helm-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap '"$(go env GOPATH)/bin/kind" delete cluster --name "$cluster"' EXIT
          "$(go env GOPATH)/bin/kind" create cluster --name "$cluster"
          HITKEEP_PREVIOUS_IMAGE="$previous" ./scripts/helm-smoke.sh "$candidate" self-hosted

  link-release-blog:
    name: Link release blog
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Add release blog link to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GHT }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PATCH="${VERSION##*.}"
            if [[ "$PATCH" != "0" ]]; then
              echo "Skipping release blog link for patch release $VERSION"
              exit 0
            fi
          fi

          BLOG_SLUG="hitkeep-${VERSION//./-}"
          BLOG_URL="https://hitkeep.com/blog/${BLOG_SLUG}/"

          if ! curl -fsSLI "$BLOG_URL" >/dev/null; then
            echo "Release blog is not published yet; leaving GitHub Release notes unchanged: $BLOG_URL"
            exit 0
          fi

          release_found=false
          for attempt in {1..5}; do
            if gh release view "$TAG" --json body --jq .body > release-notes.md; then
              release_found=true
              break
            fi
            sleep 2
          done

          if [[ "$release_found" != "true" ]]; then
            echo "GitHub Release $TAG was not found"
            exit 1
          fi

          if grep -Fq "$BLOG_URL" release-notes.md; then
            echo "Release blog link already present"
            exit 0
          fi

          {
            printf '**Release blog:** [HitKeep %s](%s)\n\n' "$VERSION" "$BLOG_URL"
            cat release-notes.md
          } > updated-release-notes.md

          gh release edit "$TAG" --notes-file updated-release-notes.md

  publish-helm:
    needs:
      - release-please
      - build-release
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.build-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Login to GHCR
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHT }}
        run: echo "${GHCR_TOKEN}" | helm registry login ghcr.io -u "${GHCR_ACTOR}" --password-stdin

      - name: Package chart
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          helm package charts/hitkeep --version "$VERSION" --app-version "$VERSION"

      - name: Push chart
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          helm push "hitkeep-${VERSION}.tgz" "oci://ghcr.io/pascalebeier/charts"

  verify-tracker-package:
    name: Verify @hitkeep/tracker release package
    needs:
      - release-please
      - build-release
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.build-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/setup-node-npm

      - name: Install dashboard dependencies
        working-directory: frontend/dashboard
        run: npm ci --no-audit --no-fund

      - name: Build and verify package
        run: ./hk qa pr --gate tracker-package

      - name: Verify release version matches package
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          pkg_version="$(jq -r '.version' frontend/tracker/package.json)"
          if [[ "$pkg_version" != "$VERSION" ]]; then
            echo "::error::@hitkeep/tracker version ${pkg_version} does not match release ${VERSION}"
            exit 1
          fi

      - name: Pack verified tracker artifact
        working-directory: frontend/tracker
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(npm pack --json)"
          tarball="$(jq -r '.[0].filename' <<< "$metadata")"
          test -n "$tarball"
          test -f "$tarball"
          mv "$tarball" verified-tracker.tgz

      - name: Upload verified tracker artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tracker-package-${{ needs.release-please.outputs.version }}
          path: frontend/tracker/verified-tracker.tgz
          retention-days: 5
          compression-level: 0

  finalize-release:
    name: Promote and publish release
    needs:
      - release-please
      - build-release
      - upgrade-from-v2-12
      - upgrade-compose-from-v2-12
      - upgrade-helm-from-v2-12
      - publish-helm
      - verify-tracker-package
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.build-release.result == 'success' && needs.upgrade-from-v2-12.result == 'success' && needs.upgrade-compose-from-v2-12.result == 'success' && needs.upgrade-helm-from-v2-12.result == 'success' && needs.publish-helm.result == 'success' && needs.verify-tracker-package.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: ./.github/actions/setup-node-npm

      - name: Download verified tracker artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tracker-package-${{ needs.release-please.outputs.version }}
          path: tracker-package

      - name: Publish immutable tracker candidate
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tarball="tracker-package/verified-tracker.tgz"
          test -f "$tarball"
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 | tr -d '\n')"
          existing="$(npm view "@hitkeep/tracker@${VERSION}" dist.integrity 2>/dev/null || true)"
          if [[ -z "$existing" ]]; then
            if ! npm publish "$tarball" --tag "release-${VERSION}"; then
              existing="$(npm view "@hitkeep/tracker@${VERSION}" dist.integrity 2>/dev/null || true)"
            else
              existing="$(npm view "@hitkeep/tracker@${VERSION}" dist.integrity)"
            fi
          fi
          if [[ "$existing" != "$integrity" ]]; then
            echo "published @hitkeep/tracker@${VERSION} does not match the verified artifact" >&2
            exit 1
          fi

      - name: Promote tracker latest dist-tag
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: npm dist-tag add "@hitkeep/tracker@${VERSION}" latest

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote immutable image to mutable tags
        env:
          CANDIDATE_DIGEST: ${{ needs.build-release.outputs.image_digest }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ needs.release-please.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release version: $VERSION" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "invalid candidate image digest" >&2
            exit 1
          fi
          IFS=. read -r major minor _ <<< "$VERSION"
          source="ghcr.io/${GITHUB_REPOSITORY}@${CANDIDATE_DIGEST}"
          for base in "ghcr.io/${GITHUB_REPOSITORY}" "${DOCKERHUB_USERNAME}/hitkeep"; do
            docker buildx imagetools create \
              --tag "${base}:latest" \
              --tag "${base}:${major}" \
              --tag "${base}:${major}.${minor}" \
              "$source"
          done

      - name: Publish draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --latest

  sync-docs-release:
    name: Publish release and configuration metadata to docs
    needs:
      - release-please
      - finalize-release
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.finalize-release.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Dispatch hitkeep-docs release synchronization
        env:
          DOWNSTREAM_REPOSITORY: PascaleBeier/hitkeep-docs
          GH_TOKEN: ${{ secrets.HITKEEP_DOCS_DISPATCH_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -uo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::Documentation synchronization was not dispatched because HITKEEP_DOCS_DISPATCH_TOKEN is unavailable"
            exit 0
          fi

          if ! gh workflow run sync-hitkeep-release.yml \
            --repo "$DOWNSTREAM_REPOSITORY" \
            --ref main \
            -f tag="${TAG}" \
            -f dry_run=false \
            -f source_run_id="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"; then
            echo "::warning::Documentation synchronization could not be dispatched; the HitKeep release remains successful"
            exit 0
          fi

          downstream_run_id=""
          for attempt in {1..30}; do
            downstream_run_id="$(
              gh run list \
                --repo "$DOWNSTREAM_REPOSITORY" \
                --workflow sync-hitkeep-release.yml \
                --event workflow_dispatch \
                --limit 50 \
                --json databaseId,displayTitle \
                | jq -r --arg source_run_id "${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
                  '.[] | select(.displayTitle | endswith("source " + $source_run_id)) | .databaseId' \
                | head -n 1
            )"
            if [[ -n "$downstream_run_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$downstream_run_id" ]]; then
            echo "::warning::Documentation synchronization was dispatched but its run URL was not available yet"
            exit 0
          fi

          downstream_url="$(
            gh run view "$downstream_run_id" \
              --repo "$DOWNSTREAM_REPOSITORY" \
              --json url \
              --jq .url
          )"
          echo "Documentation synchronization is owned by the downstream repository: ${downstream_url}"

  deploy-cloud:
    name: Trigger cloud deploy
    needs:
      - release-please
      - finalize-release
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.finalize-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch hitkeep-infra release deploy
        env:
          GH_TOKEN: ${{ secrets.GHT }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          artifact_url="https://github.com/PascaleBeier/hitkeep/releases/download/${TAG}/hitkeep-cloud-linux-arm64"

          gh workflow run release-deploy.yml \
            --repo PascaleBeier/hitkeep-infra \
            --ref main \
            -f stack=both \
            -f artifact_url="${artifact_url}" \
            -f release_version="${TAG}" \
            -f mode=deploy

          echo "Triggered hitkeep-infra release deploy for ${TAG}: ${artifact_url}"
