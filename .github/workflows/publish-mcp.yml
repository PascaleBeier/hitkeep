name: Publish MCP Registry Metadata

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable tag whose registry metadata to publish
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and source
        id: release
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$REQUESTED_RELEASE_TAG"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin "refs/tags/$release_tag:refs/tags/$release_tag"
          git checkout --detach "refs/tags/$release_tag"
          source_sha="$(git rev-parse "refs/tags/$release_tag^{commit}")"
          tag_version="${release_tag#v}"
          server_version="$(jq -r '.version' server.json)"
          if [[ "$tag_version" != "$server_version" ]]; then
            echo "Tag version ${tag_version} does not match server.json version ${server_version}." >&2
            exit 1
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: $/.github/actions/setup-node-npm

      - name: Validate MCP registry metadata
        run: ./hk qa pr --gate mcp-schema

  publish:
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          publisher_archive="mcp-publisher_linux_amd64.tar.gz"
          publisher_url="https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/$publisher_archive"
          publisher_sha256="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
          curl --fail --silent --show-error --location "$publisher_url" --output "$publisher_archive"
          printf '%s  %s\n' "$publisher_sha256" "$publisher_archive" | sha256sum --check --status
          tar xz "$publisher_archive" mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP registry metadata
        run: ./mcp-publisher publish server.json
