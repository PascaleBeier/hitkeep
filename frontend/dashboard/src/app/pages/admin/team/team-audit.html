<app-settings-card [title]="'admin.team.tabs.activity' | transloco" icon="pi pi-history">
    <div settings-card-body>
        @if (!canViewAudit()) {
        <p-message severity="secondary">{{ "admin.team.audit.readOnly" | transloco }}</p-message>
        } @else {
        <app-audit-table
            [rows]="rows()"
            [total]="total()"
            [loading]="isLoading()"
            [errorKey]="errorKey()"
            emptyTextKey="admin.team.audit.empty"
            [actionOptions]="actionOptions()"
            [outcomeOptions]="outcomeOptions()"
            [targetTypeOptions]="targetTypeOptions()"
            [query]="query()"
            [exportEnabled]="false"
            (queryChange)="onQueryChange($event)"
            (refresh)="refresh()"
        />
        }
    </div>
</app-settings-card>
