<section
    class="flex h-full min-w-0 flex-col overflow-hidden rounded-lg border border-[var(--p-content-border-color)] bg-[var(--p-content-background)]"
    [attr.aria-labelledby]="titleId()"
    [attr.aria-describedby]="description() ? titleId() + '-description' : null"
    [attr.aria-busy]="loading()"
>
    <header class="flex items-start justify-between gap-4 border-b border-[var(--p-content-border-color)] px-4 py-3 sm:px-5 sm:py-4">
        <div class="grid min-w-0 gap-1">
            <div class="flex min-w-0 flex-wrap items-center gap-2">
                <h2 class="m-0 text-base leading-5 font-semibold text-[var(--p-text-color)]" [id]="titleId()">{{ title() }}</h2>
                <ng-content select="[system-status-card-status]" />
            </div>
            @if (description()) {
            <p class="m-0 max-w-[70ch] text-sm leading-5 text-[var(--p-text-muted-color)]" [id]="titleId() + '-description'">{{ description() }}</p>
            }
        </div>

        <div class="flex shrink-0 items-center justify-end gap-2">
            <ng-content select="[system-status-card-header]" />

            @if (refreshable()) {
            <p-button
                icon="pi pi-refresh"
                severity="secondary"
                size="small"
                styleClass="min-h-11 min-w-11 sm:min-h-8 sm:min-w-8"
                [text]="true"
                [rounded]="true"
                [loading]="loading()"
                [disabled]="refreshDisabled() || loading()"
                [pTooltip]="refreshLabel()"
                tooltipPosition="top"
                [ariaLabel]="refreshLabel()"
                (onClick)="refreshClicked.emit()"
            />
            }
        </div>
    </header>

    <div class="min-w-0 flex-1 p-4 sm:p-5">
        <ng-content />
    </div>

    @if (hasAction()) {
    <footer class="flex justify-end border-t border-[var(--p-content-border-color)] px-4 py-3 sm:px-5">
        <p-button
            [icon]="actionIcon()"
            [label]="actionLabel()"
            [severity]="actionSeverity()"
            size="small"
            styleClass="min-h-11 sm:min-h-8"
            [loading]="actionLoading()"
            [disabled]="actionDisabled() || actionLoading()"
            (onClick)="actionClicked.emit()"
        />
    </footer>
    }

    <ng-content select="[system-status-card-footer]" />
</section>
