<app-route-progress-bar />
@if (routeUnavailable()) {
<main class="application-state" role="alert" aria-labelledby="route-unavailable-title">
    <h1 id="route-unavailable-title">{{ 'applicationError.routeUnavailable.title' | transloco }}</h1>
    <p>{{ 'applicationError.routeUnavailable.message' | transloco }}</p>
    <button type="button" (click)="reloadApplication()">{{ 'applicationError.actions.reloadApplication' | transloco }}</button>
</main>
} @else { <router-outlet />
}
