<div class="md:hidden flex flex-col gap-3 p-4 bg-surface-card border-b border-surface-200 dark:border-surface-700">
    <div class="flex items-center justify-between">
        <app-brand size="small" />
        <div class="flex items-center gap-2">
            <app-user-controls [showMenu]="!shareService.isShareMode()" />
            <button type="button" (click)="isMobileDrawerOpen.set(true)" class="p-2 rounded hover:bg-surface-100 dark:hover:bg-surface-800" [attr.aria-label]="'nav.mainSidebarAria' | transloco">
                <i class="pi pi-bars text-xl" aria-hidden="true"></i>
            </button>
        </div>
    </div>
    @if (!shareService.isShareMode()) {
    <div class="flex items-center gap-2">
        <app-site-selector class="min-w-0 flex-1" [sites]="siteService.sites()" [current]="siteService.activeSite()" [loading]="siteService.isLoading()" (siteSelected)="context.onSiteSelected($event)" />
        <button
            type="button"
            (click)="context.openSiteSettings('general')"
            [disabled]="!siteService.activeSite()"
            class="cursor-pointer flex size-9 shrink-0 items-center justify-center rounded-md border border-surface-200 text-muted-color transition-colors hover:bg-surface-100 hover:text-[var(--p-text-color)] focus:outline-none focus:ring-2 focus:ring-primary-500 disabled:cursor-not-allowed disabled:opacity-50 dark:border-surface-700 dark:hover:bg-surface-800"
            [attr.aria-label]="'sites.selector.siteSettingsAria' | transloco"
            [title]="'sites.selector.siteSettingsAria' | transloco"
        >
            <i class="pi pi-cog" aria-hidden="true"></i>
        </button>
    </div>
    }
</div>
