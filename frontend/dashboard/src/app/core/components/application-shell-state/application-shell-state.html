<main class="application-shell-state">
    <section class="application-shell-state__panel" [attr.aria-labelledby]="titleId()" [attr.role]="danger() ? 'alert' : 'status'" [attr.aria-live]="danger() ? 'assertive' : 'polite'" aria-atomic="true">
        <span class="application-shell-state__icon" [class.application-shell-state__icon--danger]="danger()">
            <i [class]="icon()" aria-hidden="true"></i>
        </span>

        <div class="application-shell-state__copy">
            <h1 [id]="titleId()">{{ titleKey() | transloco }}</h1>
            <p>{{ messageKey() | transloco }}</p>
        </div>

        @if (primaryActionLabelKey(); as labelKey) {
        <button class="application-shell-state__action" type="button" (click)="primaryAction.emit()">
            <i [class]="primaryActionIcon()" aria-hidden="true"></i>
            <span>{{ labelKey | transloco }}</span>
        </button>
        }
    </section>
</main>
