<div class="hk-feedback-message hk-feedback-message--token one-time-credential" role="status" aria-live="polite" aria-atomic="true">
    <strong class="one-time-credential__title">{{ titleKey() | transloco }}</strong>
    <p class="one-time-credential__description">{{ descriptionKey() | transloco }}</p>
    <code class="one-time-credential__value">{{ value() }}</code>
    <div class="one-time-credential__actions">
        <app-copy-control [value]="value()" [labelKey]="copyLabelKey()" [text]="true" />
    </div>
</div>
