<div class="hk-auth-password">
    <input pInputText [id]="inputId()" [type]="visible() ? 'text' : 'password'" [formControl]="control()" [autocomplete]="autocomplete()" [fluid]="true" [attr.aria-invalid]="invalid() ? true : null" [attr.aria-describedby]="describedBy()" />
    <button type="button" class="hk-auth-password-toggle" [attr.aria-label]="(visible() ? 'common.hidePassword' : 'common.showPassword') | transloco" [attr.aria-pressed]="visible()" (click)="visible.set(!visible())">
        <i [class]="visible() ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
    </button>
</div>
