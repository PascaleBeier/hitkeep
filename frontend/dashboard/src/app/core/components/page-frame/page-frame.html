<div class="page-frame">
    <app-page-header>
        <ng-template appPageHeaderLeft>
            <div class="page-frame__heading">
                <app-page-breadcrumb [items]="breadcrumbItems()" />
                @if (subtitle()) {
                <p class="page-frame__subtitle">{{ subtitle() }}</p>
                }
            </div>
        </ng-template>
    </app-page-header>

    <div class="page-frame__body">
        <ng-content />
    </div>
</div>
