# Example nginx config for HitKeep custom tracking domains with external TLS.
#
# Replace the hostnames and certificate paths before using this in production.
# Each tracking hostname must already have a valid certificate before HitKeep can
# mark it TLS-ready. Use one certificate with all names in the SAN list, a
# wildcard certificate, or split this into one server block per hostname.

upstream hitkeep_backend {
  server hitkeep:8080;
  keepalive 32;
}

server {
  listen 80;
  server_name analytics.example.com tracker.customer-one.example tracker.customer-two.example;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name analytics.example.com;

  ssl_certificate /etc/nginx/certs/analytics.example.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/analytics.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://hitkeep_backend;
  }
}

server {
  listen 443 ssl http2;
  server_name tracker.customer-one.example tracker.customer-two.example;

  ssl_certificate /etc/nginx/certs/tracking/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/tracking/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location ~ ^/(hk\.js|hk-vitals\.js|ingest|ingest/event|ingest/web-vitals)$ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://hitkeep_backend;
  }

  location / {
    return 404;
  }
}
